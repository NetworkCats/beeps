# Production, on one server. deploy/ansible copies this file to /srv/beeps with the files it reads:
#   release.env      which image each app colour runs, written by beeps-deploy (only used to fill in this file)
#   app.env          the app's configuration (.env.example lists every key), from the GitHub environment
#   search.env       the app's own Meilisearch key, created by beeps-deploy on the first deploy
#   postgres.env, meilisearch.env   those services' passwords
#   nginx/           nginx's configuration; nginx/upstream.conf names the colour taking traffic
#   secrets/tls/     the Cloudflare Origin CA certificate (nginx only)
#   secrets/app/     the Data Protection certificate (the app only)
#
# Blue-green: app-blue and app-green are the same app; one takes traffic, the other is stopped or starting the next
# release. beeps-deploy starts the idle one, waits for /healthz, points nginx at it and stops the other. Never run
# `docker compose up` without naming services: it would restart the colour taking traffic.
#
# Nothing listens on a public address but nginx, which uses the host network so UFW applies to it (Docker's own port
# forwarding would bypass UFW). nginx reaches the app at its fixed address on the beeps network, so the app sees every
# request come from that network's gateway, 172.30.0.1, the only proxy it trusts (ForwardedHeaders__KnownProxies__0).
name: beeps

x-app: &app
  # Not PID 1: a .NET process that crashes as PID 1 never exits (abort's SIGABRT is ignored), it spins at full CPU.
  init: true
  env_file:
    - path: app.env
    - path: search.env
      required: false
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ForwardedHeaders__KnownProxies__0: 172.30.0.1
    DataProtection__CertificatePath: /run/secrets/beeps/dataprotection.pfx
    # The GC heap may take half of mem_limit (hexadecimal 0x32 = 50%), not the 75% it takes by default. With that much
    # room it put off collecting: a crawl through public pages took the app to 590 MB of 640, and it stayed near 500
    # once the crawl was over, though the live heap is near 120 MB. At 40%, collections began to cost throughput.
    DOTNET_GCHeapHardLimitPercent: "0x32"
  volumes:
    - ./secrets/app:/run/secrets/beeps:ro
  restart: unless-stopped
  # Long enough for open streams to be told to reconnect and in-flight requests to finish.
  stop_grace_period: 30s
  mem_limit: 640m
  logging: &logging
    driver: local
    options:
      max-size: 20m
      max-file: "5"

services:
  postgres:
    image: postgres:18.6
    env_file: postgres.env
    environment:
      POSTGRES_USER: beeps
      POSTGRES_DB: beeps
    # Sized for the Vultr plan (deploy/terraform): 2 vCPU threads, 2 GB and local NVMe, shared with everything else.
    command:
      - postgres
      # Memory. shared_buffers and the page cache of the data files both count against mem_limit below, so the cache
      # the planner may count on is what that leaves: about half of it.
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      # Connections: two app colours of 25 each (Maximum Pool Size, deploy/ansible/group_vars/all.yml) while a deploy
      # overlaps them, plus the migration bundle, pg_dump and psql. Each backend keeps up to 200 prepared statements.
      - -c
      - max_connections=60
      # A backend left holding locks and old row versions by a forgotten transaction is ended.
      - -c
      - idle_in_transaction_session_timeout=5min
      # Containers have their own network namespace, with the kernel's 2-hour keepalive whatever the host says: a
      # backend whose client vanished without closing would hold its connection slot that long.
      - -c
      - tcp_keepalives_idle=300
      - -c
      - tcp_keepalives_interval=30
      - -c
      - tcp_keepalives_count=5
      # Planner: NVMe reads at random cost about what they cost in order, and many can be in flight at once.
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      # The app's queries are short; compiling them costs more than it saves.
      - -c
      - jit=off
      # Two threads serve the app too: one query gets at most one helper.
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_parallel_maintenance_workers=1
      # WAL: lz4 compresses full-page images for a fraction of pglz's CPU (wal_compression=on); fewer checkpoints
      # write fewer of them.
      - -c
      - wal_buffers=16MB
      - -c
      - wal_compression=lz4
      - -c
      - default_toast_compression=lz4
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      # Autovacuum: counters and timelines rewrite a small share of large tables all day; vacuum and analyze them
      # after 5% has changed instead of 20% and 10%. Two workers, so vacuum leaves the app a thread.
      - -c
      - autovacuum_max_workers=2
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.05
      # What to look at when tuning: per-statement figures (pg_stat_statements, created by deploy/ansible), slow
      # statements, lock waits and sorts that spilled to disk. Never the parameters: they can hold addresses and tokens.
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=1000
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_parameter_max_length=0
      - -c
      - log_lock_waits=on
      - -c
      - log_temp_files=0
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - beeps
    shm_size: 256mb
    # shared_buffers, about 300 MB with WAL buffers and locks, and up to 60 backends; it may swap as much again.
    mem_limit: 768m
    stop_grace_period: 60s
    # Every second while starting, so `up --wait` (deploy/ansible) returns as soon as it is ready; then every 30 s, as
    # nothing acts on it but Docker's status. The same for Valkey and Meilisearch.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beeps -d beeps"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped
    logging: *logging

  # Every key has a TTL, so when memory runs out the least recently used are dropped instead of writes failing.
  # The append-only file keeps what is not yet in PostgreSQL (counts waiting to be written back, the live event stream);
  # the snapshots Valkey also takes by default would only fork it again, at times its copy-on-write pages count
  # against mem_limit, so they are off.
  valkey:
    image: valkey/valkey:9.1.2
    command: ["valkey-server", "--appendonly", "yes", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - valkey-data:/data
    networks:
      - beeps
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped
    logging: *logging

  meilisearch:
    image: getmeili/meilisearch:v1.55.0
    env_file: meilisearch.env
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 256MiB
      MEILI_MAX_INDEXING_THREADS: "1"
      # INFO logs every request: each search, the health check, and the app's polling of every write until it is done.
      MEILI_LOG_LEVEL: WARN
    volumes:
      - meili-data:/meili_data
    networks:
      - beeps
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped
    logging: *logging

  app-blue:
    <<: *app
    image: ${BEEPS_BLUE_IMAGE:-beeps:none}
    volumes:
      - ./secrets/app:/run/secrets/beeps:ro
      - blue-data:/var/lib/beeps
    networks:
      beeps:
        ipv4_address: 172.30.0.11

  app-green:
    <<: *app
    image: ${BEEPS_GREEN_IMAGE:-beeps:none}
    volumes:
      - ./secrets/app:/run/secrets/beeps:ro
      - green-data:/var/lib/beeps
    networks:
      beeps:
        ipv4_address: 172.30.0.12

  # One-off commands with a release's image (beeps-deploy): the migration bundle, `search create-key`, `search rebuild`.
  # It never serves traffic and takes no fixed address.
  app-tools:
    <<: *app
    image: ${BEEPS_TOOLS_IMAGE:-beeps:none}
    profiles: ["tools"]
    restart: "no"
    networks:
      - beeps

  # The directory is mounted rather than single files: the deploy replaces upstream.conf by renaming a new file over it,
  # which a file mount would never see.
  nginx:
    image: nginx:1.30.6
    network_mode: host
    command: ["nginx", "-c", "/etc/nginx/beeps/nginx.conf", "-g", "daemon off;"]
    volumes:
      - ./nginx:/etc/nginx/beeps:ro
      - ./secrets/tls:/etc/nginx/tls:ro
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *logging

networks:
  beeps:
    name: beeps
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
          # Addresses handed out to the other containers come from the upper half, so a service recreated while one
          # colour is stopped cannot take that colour's fixed address (.11, .12) and block its next start.
          ip_range: 172.30.0.128/25

volumes:
  postgres-data:
  valkey-data:
  meili-data:
  blue-data:
  green-data:
