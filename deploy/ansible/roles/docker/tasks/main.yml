# Docker's own packages (PLAN 9.0: Docker and UFW are all the server runs outside containers).
- name: Add Docker's apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"
    signed_by: https://download.docker.com/linux/debian/gpg

- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Configure the Docker daemon
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart Docker

- name: Start Docker at boot
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
