# Kernel and network tuning for the beeps server (roles/base): 2 vCPU, 2 GB, everything in Docker behind nginx, every
# visitor arriving over Cloudflare's long-lived connections. Most net.* settings are per network namespace: they reach
# nginx, which uses the host's network, and its connections to the app, but not what runs inside the containers.

# --- Memory -----------------------------------------------------------------------------------------------------------
# Swap only under real pressure; PostgreSQL and the app's heaps should stay in memory.
vm.swappiness = 10
# Valkey forks to rewrite its append-only file; without this, the fork can fail on a busy server.
vm.overcommit_memory = 1
# Write dirty pages back early and in small batches, so PostgreSQL's checkpoints do not stall on a flood of them.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
# Keep directory and inode caches a little longer than the default.
vm.vfs_cache_pressure = 50
# Meilisearch maps its indexes into memory.
vm.max_map_count = 262144

# --- Files ------------------------------------------------------------------------------------------------------------
# fs.file-max and fs.nr_open are left alone: systemd already raises both to their largest values at boot.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# --- Network: queues --------------------------------------------------------------------------------------------------
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_syncookies = 1

# --- Network: throughput ----------------------------------------------------------------------------------------------
# BBR with fair queueing: better throughput and latency to Cloudflare's edge than CUBIC, especially with some loss.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# Up to 16 MB per socket, for the occasional large response; the defaults stay small so many idle sockets cost little.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
# Less data waiting in the kernel per socket, so HTTP/2 can put urgent frames first.
net.ipv4.tcp_notsent_lowat = 16384
# Cloudflare and nginx keep connections open between requests; do not drop back to slow start after each pause.
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1

# --- Network: connections ---------------------------------------------------------------------------------------------
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
# Find dead peers within about 7 minutes instead of 2 hours. Only on the host's own network (nginx, SSH): containers
# get the kernel defaults, so PostgreSQL sets its own (compose.prod.yml) and Valkey's tcp-keepalive is already 300 s.
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
net.netfilter.nf_conntrack_max = 262144
net.netfilter.nf_conntrack_tcp_timeout_established = 86400

# --- Network: safety --------------------------------------------------------------------------------------------------
net.ipv4.tcp_rfc1337 = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# --- IPv6: off --------------------------------------------------------------------------------------------------------
# The server has no IPv6 (deploy/terraform); Cloudflare still serves visitors over IPv6. Loopback keeps ::1, which
# some programs expect to exist.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 0
