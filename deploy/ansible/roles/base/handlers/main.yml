- name: Apply the kernel settings
  ansible.builtin.command: sysctl --load /etc/sysctl.d/60-beeps.conf
  changed_when: true

- name: Apply transparent huge pages
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/beeps-thp.conf
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reexec: true

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

# A broken configuration fails here, before the restart could leave the server unreachable.
- name: Check the ssh configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: true
  notify: Restart ssh

- name: Restart ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
