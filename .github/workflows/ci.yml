name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Client assets first: MapStaticAssets fingerprints whatever is in wwwroot/dist at `dotnet build`.
      - name: Install client dependencies
        run: npm ci

      - name: Build client (type check + bundle)
        run: npm run build

      - name: Test client
        run: npm test

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
