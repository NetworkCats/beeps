name: CI

# Pull requests and main; deploy.yml runs it once more for each version tag, and deploys only when it passes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Client assets first: MapStaticAssets fingerprints whatever is in wwwroot/dist at `dotnet build`.
      - name: Install client dependencies
        run: npm ci

      - name: Build client (type check + bundle)
        run: npm run build

      - name: Test client
        run: npm test

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  # The deploy configuration: Terraform, Ansible and the server scripts.
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6

      - name: Terraform format
        run: terraform -chdir=deploy/terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          terraform -chdir=deploy/terraform init -backend=false -input=false
          terraform -chdir=deploy/terraform validate
        env:
          VULTR_API_KEY: unused

      - name: Install Ansible
        run: pipx install --include-deps ansible==14.5.0

      - name: Ansible syntax
        working-directory: deploy/ansible
        run: |
          ansible-playbook --syntax-check site.yml
          ansible-playbook --syntax-check deploy.yml

      - name: Server scripts
        run: |
          shellcheck deploy/ansible/roles/beeps/files/beeps-deploy deploy/ansible/roles/beeps/files/beeps-backup
          python3 -m py_compile deploy/ansible/roles/firewall/files/beeps-cloudflare-ips
          # The env files live only on the server; newer Compose wants them present even without resolving them.
          touch app.env postgres.env meilisearch.env
          docker compose -f compose.prod.yml config --quiet --no-env-resolution
